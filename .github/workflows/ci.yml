name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  GODOT_VERSION: 4.4-stable

jobs:
  test-build:
    name: Test Build
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.4
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

    - name: Test Web Build
      run: |
        mkdir -v -p build/web
        godot --headless --verbose --export-release "Web" build/web/index.html

    - name: Test Windows Build
      run: |
        mkdir -v -p build/windows
        godot --headless --verbose --export-release "Windows Desktop" build/windows/hot-reload.exe

    - name: Validate builds
      run: |
        ls -la build/web/
        ls -la build/windows/
        # Check if files were created
        [ -f "build/web/index.html" ] && echo "Web build successful" || exit 1
        [ -f "build/windows/hot-reload.exe" ] && echo "Windows build successful" || exit 1
