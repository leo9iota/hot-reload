name: Build and Release

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  GODOT_VERSION: 4.4-stable
  EXPORT_NAME: hot-reload

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.4
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

    - name: Web Build
      run: |
        mkdir -v -p build/web
        godot --headless --verbose --export-release "Web" build/web/index.html

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web
        path: build/web

  export-windows:
    name: Windows Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.4
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

    - name: Windows Build
      run: |
        mkdir -v -p build/windows
        godot --headless --verbose --export-release "Windows Desktop" build/windows/${EXPORT_NAME}.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: build/windows

  export-linux:
    name: Linux Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.4
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

    - name: Linux Build
      run: |
        mkdir -v -p build/linux
        godot --headless --verbose --export-release "Linux/X11" build/linux/${EXPORT_NAME}.x86_64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux
        path: build/linux

  export-mac:
    name: Mac Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.4
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

    - name: Mac Build
      run: |
        mkdir -v -p build/mac
        godot --headless --verbose --export-release "macOS" build/mac/${EXPORT_NAME}.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac
        path: build/mac

  create-release:
    name: Create Release
    needs: [ export-web, export-windows, export-linux, export-mac ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      run: |
        # Web build
        cd artifacts/web
        zip -r ../../${EXPORT_NAME}-web.zip .
        cd ../..

        # Windows build
        cd artifacts/windows
        zip -r ../../${EXPORT_NAME}-windows.zip .
        cd ../..

        # Linux build
        cd artifacts/linux
        chmod +x ${EXPORT_NAME}.x86_64
        tar -czf ../../${EXPORT_NAME}-linux.tar.gz .
        cd ../..

        # Mac build
        cd artifacts/mac
        mv ${EXPORT_NAME}.zip ../../${EXPORT_NAME}-mac.zip
        cd ../..

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        body: |
          ## Release ${{ steps.version.outputs.VERSION }}

          Automated release for hot-reload game.

          ### Downloads:
          - **Web**: `${{ env.EXPORT_NAME }}-web.zip` - Unzip and serve the files from a web server
          - **Windows**: `${{ env.EXPORT_NAME }}-windows.zip` - Unzip and run the .exe file
          - **Linux**: `${{ env.EXPORT_NAME }}-linux.tar.gz` - Extract and run the executable
          - **macOS**: `${{ env.EXPORT_NAME }}-mac.zip` - Unzip and run the .app bundle

    - name: Upload Web Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./${{ env.EXPORT_NAME }}-web.zip
        asset_name: ${{ env.EXPORT_NAME }}-web.zip
        asset_content_type: application/zip

    - name: Upload Windows Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./${{ env.EXPORT_NAME }}-windows.zip
        asset_name: ${{ env.EXPORT_NAME }}-windows.zip
        asset_content_type: application/zip

    - name: Upload Linux Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./${{ env.EXPORT_NAME }}-linux.tar.gz
        asset_name: ${{ env.EXPORT_NAME }}-linux.tar.gz
        asset_content_type: application/gzip

    - name: Upload Mac Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./${{ env.EXPORT_NAME }}-mac.zip
        asset_name: ${{ env.EXPORT_NAME }}-mac.zip
        asset_content_type: application/zip
