name: Deploy to GitHub Pages

on:
  # Only manual trigger, no automatic deployment
  workflow_dispatch:


env:
  GODOT_VERSION: 4.4-stable
  EXPORT_NAME: hot-reload

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.4
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        mv /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}

    - name: Web Build
      run: |
        mkdir -v -p build/web
        godot --headless --verbose --export-release "Web" build/web/index.html

    - name: Add coi-serviceworker (for SharedArrayBuffer support)
      run: |
        curl -fsSL https://github.com/gzuidhof/coi-serviceworker/raw/master/coi-serviceworker.js > build/web/coi-serviceworker.js
        sed -i 's|<script src="index.js"></script>|<script src="coi-serviceworker.js"></script><script src="index.js"></script>|' build/web/index.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/web

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
